services:
  - type: web
    name: concordiaorbis-api
    runtime: node
    rootDir: backend
    # Do not append db:setup — build already runs dedupe, push, and seed.
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: ani-platform-db
          property: connectionString
      # Copy JWT values from the old ani-platform-api service — do not regenerate if migrating.
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://concordiaorbis-platform-one.vercel.app
      - key: GOOGLE_REDIRECT_URI
        value: https://concordiaorbis-api.onrender.com/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: ani-platform-db
    plan: free
